[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "system-monitor-backend"
version = "0.1.0"
description = "A lightweight hardware monitoring REST API."
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn",
    "psutil",
    "py-cpuinfo",
    "pydantic"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2"
]